configuration:
  pageTitle: "Knowledge Base"
  pageTitleSuffix: ""
  enableSPA: false
  enablePopovers: true
  locale: "en-US"
  baseUrl: "willkelly.dev/knowledge"
  ignorePatterns:
    - private
    - templates
    - .obsidian
  defaultDateType: created
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    # Palatino is set in styles/custom.scss to match willkelly.dev. These Google
    # fonts are only downloaded on devices that don't have Palatino installed.
    typography:
      header: "Crimson Pro"
      body: "Crimson Pro"
      code: "IBM Plex Mono"
    # Ported from the homepage (HomePage/source/css/global.css):
    #   paper #fffbf6, off-black #3d3d3d, off-black-darker #222222,
    #   red-type #c8392b, ornament #b8a893
    colors:
      lightMode:
        light: "#fffbf6"
        lightgray: "#ebe3d8"
        gray: "#b8a893"
        darkgray: "#3d3d3d"
        dark: "#222222"
        secondary: "#c8392b"
        tertiary: "#a8876a"
        highlight: "rgba(200, 57, 43, 0.06)"
        textHighlight: "#f3d27a88"
      # The homepage has no dark mode; this is the same palette as ink on dark paper.
      darkMode:
        light: "#1b1916"
        lightgray: "#35302a"
        gray: "#7a6f62"
        darkgray: "#d9d2c7"
        dark: "#f2ece2"
        secondary: "#e2604f"
        tertiary: "#c4a88a"
        highlight: "rgba(226, 96, 79, 0.10)"
        textHighlight: "#b3862288"

plugins:
  # Transformers
  - source: github:quartz-community/note-properties
    enabled: true
  - source: github:quartz-community/created-modified-date
    enabled: true
    options:
      priority: [frontmatter, filesystem]
  - source: github:quartz-community/syntax-highlighting
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
  - source: github:quartz-community/obsidian-flavored-markdown
    enabled: true
    options:
      enableInHtmlEmbed: false
  - source: github:quartz-community/github-flavored-markdown
    enabled: true
  - source: github:quartz-community/crawl-links
    enabled: true
    options:
      markdownLinkResolution: shortest
  - source: github:quartz-community/description
    enabled: true
  - source: github:quartz-community/latex
    enabled: true
    options:
      renderEngine: katex

  # Filters
  - source: github:quartz-community/remove-draft
    enabled: true

  # Page types / emitters
  - source: github:quartz-community/content-page
    enabled: true
  - source: github:quartz-community/folder-page
    enabled: true
  - source: github:quartz-community/tag-page
    enabled: true
  - source: github:quartz-community/alias-redirects
    enabled: true
  - source: github:quartz-community/content-index
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
  - source: github:quartz-community/article-title
    enabled: true
    layout:
      position: beforeBody
      priority: 10

  # Layout — left sidebar
  - source: github:quartz-community/page-title
    enabled: true
    layout:
      position: left
      priority: 10
  - source: github:quartz-community/search
    enabled: true
    layout:
      position: left
      priority: 20
  - source: github:quartz-community/spacer
    enabled: true
    layout:
      position: left
      priority: 30
      display: mobile-only
  - source: github:quartz-community/explorer
    enabled: true
    layout:
      position: left
      priority: 50
      display: desktop-only
    options:
      folderClickBehavior: collapse

  # Layout — right sidebar
  - source: github:quartz-community/darkmode
    enabled: true
    layout:
      position: right
      priority: 10
  - source: github:quartz-community/graph
    enabled: true
    layout:
      position: right
      priority: 20
  - source: github:quartz-community/table-of-contents
    enabled: true
    layout:
      position: right
      priority: 30
      display: desktop-only

# The home link and footer are custom components, added in .quartz-config/quartz.ts.
